<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Kartu Peserta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Menggunakan nama berkas logo sesuai di GitHub -->
    <img src="LOGO SM RAJA.png" alt="Logo SM RAJA" class="logo">
    
    <h2>Cari Kartu Peserta</h2>
    <p class="subtitle">Sisingamangaraja Science Olympiad 2026</p>

    <form id="searchForm">
      <div class="form-group">
        <label for="nama">Nama Peserta</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap..." required>
      </div>

      <div class="form-group">
        <label for="sekolah">Tingkat / Jenjang Sekolah</label>
        <select id="sekolah" required>
          <option value="">-- Pilih Jenjang --</option>
          <option value="SD/MI">SD / MI</option>
          <option value="SMP/MTS">SMP / MTS</option>
          <option value="SMA/SMK/MA">SMA / SMK / MA</option>
        </select>
      </div>

      <button type="submit" id="btnSearch">Cari Kartu</button>
    </form>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <!-- Disesuaikan dengan nama berkas di GitHub (huruf S besar) -->
  <script src="Script.js"></script>
</body>
</html>
